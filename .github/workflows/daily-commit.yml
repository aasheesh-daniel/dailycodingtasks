
name: Daily Python Automation

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  python-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Python automation
        run: python scripts/run_daily.py

      - name: Commit generated reports
        run: |
          git config user.name "aasheesh-daniel"
          git config user.email "182431233+aasheesh-daniel@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "chore: automated Python practice report"
          git push
